name: build
on:
  schedule:
    # Every 6h (design: steady guide; primary consume refresh is daily-ish).
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
      - 'tests/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    # Don't publish from PRs — only main / schedule / manual.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # Stable key so restore hits; counter persists across runs (quarantine grace).
      - name: Restore healthcheck state
        uses: actions/cache@v4
        with:
          path: build/_state.json
          key: healthcheck-state-v1
          restore-keys: |
            healthcheck-state-

      - run: python -m pipeline

      - name: Append report to job summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f build/report.json ]; then
            python scripts/job_summary.py build/report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_number }}
          path: |
            build/report.json
            build/out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/out
          publish_branch: gh-pages
          keep_files: false
          commit_message: "build ${{ github.run_number }}"
