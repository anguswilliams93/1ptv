name: discover-channels

# Scans iptv-org for English-market channels not yet covered by config.yaml and
# opens (or updates) a tracking issue with a ready-to-paste YAML snippet.
on:
  schedule:
    - cron: '30 8 * * 1'   # Mondays 08:30 UTC
  workflow_dispatch:

concurrency:
  group: discover-channels
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt
      - run: python -m pipeline.discover --out build/discover

      - name: Append candidates to job summary
        run: cat build/discover/candidates.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: channel-candidates-${{ github.run_number }}
          path: build/discover/
          retention-days: 30

      - name: Open or update discovery issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT=$(python -c "import json; print(len(json.load(open('build/discover/candidates.json'))))")
          TITLE="Channel discovery: new iptv-org candidates"
          BODY_FILE=$(mktemp)
          {
            echo "<!-- 1ptv-channel-discovery -->"
            echo ""
            echo "_Auto-generated by [\`discover-channels\`](.github/workflows/discover-channels.yml)."
            echo "Last run: $(date -u +%Y-%m-%dT%H:%MZ) · \`${COUNT}\` candidates._"
            echo ""
            cat build/discover/candidates.md
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --label channel-discovery --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            if [ "$COUNT" -eq 0 ]; then
              echo "No candidates and no open issue — nothing to do."
              exit 0
            fi
            gh label create channel-discovery --color "0E8A16" --description "iptv-org channel discovery" 2>/dev/null || true
            gh issue create --title "$TITLE" --label channel-discovery --body-file "$BODY_FILE"
          else
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            if [ "$COUNT" -eq 0 ]; then
              gh issue comment "$EXISTING" --body "Discovery run found **0** new candidates (all tracked markets already covered or filtered)."
            else
              gh issue comment "$EXISTING" --body "Discovery refreshed: **${COUNT}** candidates. See issue body for the table + YAML snippet."
            fi
          fi
